server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;
    server_tokens off;

    root   /usr/share/nginx/html;
    index  index.html;

    access_log  /var/log/nginx/host.access.log  main;

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml text/javascript
                      application/xml application/javascript application/json
                      application/rss+xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Astro 以 build.format: 'file' 输出 /search -> search.html
    location / {
        try_files $uri $uri.html $uri/ =404;
        expires -1;
    }

    # /search/ -> /search，避免尾斜杠 404（保留查询参数）
    location = /search/ {
        return 301 /search$is_args$args;
    }

    # 带内容哈希的构建产物可以长期缓存
    location /_astro/ {
        expires 1y;
    }

    location = /favicon.ico {
        expires 1y;
    }

    # Service Worker 与 OpenSearch 描述文件需要及时更新
    location = /service-worker.js {
        expires -1;
    }

    location = /opensearch.xml {
        expires 1h;
    }

    location = /robots.txt {
        expires 1h;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}
